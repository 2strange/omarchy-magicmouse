# Release: on a tag v<manifest version>, test the Rust daemon, check it against the Python
# daemon's golden traces, build a static x86_64 binary and attach it (plus its SHA-256) to
# the GitHub release of that tag, with a build provenance attestation for the binary.
# install.sh does not trust the release: it installs only the binary whose SHA-256 is pinned in
# daemon.lock, so after a release its digest (printed in step "Assets") is committed there, and
# that commit is the one to review.
#
# Static musl build: no glibc symbol versions, so the binary runs on any x86_64 Linux,
# whatever glibc the runner or the user has. All dependencies are pure Rust (no C code),
# and the daemon is mostly asleep in poll(2), so musl's slower malloc does not matter.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}  # build and test only; uploads happen for tags

# Build and test with a read-only token (build scripts and proc macros of the crates run there);
# only the small release job, which runs no repository code, may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl
  ASSET: magic-mouse-daemon-x86_64-linux

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Tag matches manifest.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::tag $GITHUB_REF_NAME, manifest.json says $want"; exit 1; }

      - name: Toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal  # pinned: the build the release was tested with
          rustup default 1.99.1
          rustup target add "$TARGET"

      - name: Unit tests
        working-directory: daemon-rs
        run: cargo test --locked

      - name: Release build (static)
        working-directory: daemon-rs
        run: |
          cargo build --release --locked --target "$TARGET"
          file "target/$TARGET/release/magic-mouse-daemon" | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'

      - name: Golden traces (Python v1.4.1 behaviour)
        # compare.py needs only the standard library; python-evdev is needed by golden.py
        # alone (regenerating the traces, or naming the input line of a divergence).
        run: >
          python3 tools/compare.py --golden daemon-rs/tests/golden
          --run "daemon-rs/target/$TARGET/release/magic-mouse-daemon" --exact

      - name: Assets
        run: |
          mkdir dist
          cp "daemon-rs/target/$TARGET/release/magic-mouse-daemon" "dist/$ASSET"
          (cd dist && sha256sum "$ASSET" > "$ASSET.sha256" && cat "$ASSET.sha256")

      - name: Keep the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ env.ASSET }}
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release / upload assets
      actions: read        # fetch the build job's artifact
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store it, for `gh attestation verify`
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch the build
        # No checkout, no repository code: only the two files the build job made.
        run: |
          gh run download "$GITHUB_RUN_ID" -n "$ASSET" -D dist
          (cd dist && sha256sum -c "$ASSET.sha256")

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/${{ env.ASSET }}

      - name: Attach to the release
        # No --clobber: assets of a release are never replaced silently.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$ASSET" "dist/$ASSET.sha256"
          else
            gh release create "$GITHUB_REF_NAME" "dist/$ASSET" "dist/$ASSET.sha256" \
              --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
